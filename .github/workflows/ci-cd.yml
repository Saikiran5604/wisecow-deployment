name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: saikiranreddy5604/wisecow:latest

      - name: Set up Kind Cluster
        uses: helm/kind-action@v1.8.0

      - name: Verify Deployment in Kubernetes Cluster
        run: |
          echo "Applying manifests..."
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          
          echo "Waiting for pods to be ready..."
          kubectl rollout status deployment/wisecow-deployment --timeout=60s
          
          echo "Checking active pods and services..."
          kubectl get pods
          kubectl get services
          kubectl get ingress
          
          echo "Running smoke test inside the cluster..."
          kubectl port-forward svc/wisecow-service 4499:4499 &
          sleep 3
          curl -I http://localhost:4499